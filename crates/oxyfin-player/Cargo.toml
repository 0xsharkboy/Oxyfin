[package]
name = "oxyfin-player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["mpv"]
mpv = ["dep:libmpv2", "dep:libmpv2-sys", "dep:raw-window-handle", "dep:glow"]

[dependencies]
libmpv2 = { version = "=7.0.1", optional = true }
libmpv2-sys = { version = "=4.0.1", optional = true }
raw-window-handle = { version = "0.6", optional = true }
glow = { version = "0.18", optional = true }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-femtovg", "raw-window-handle-06"] }

[[example]]
name = "video"
required-features = ["mpv"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
