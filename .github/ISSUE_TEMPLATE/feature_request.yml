name: Feature request
description: Suggest something Oxyfin should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Check ROADMAP.md first, it may already be planned.
    validations:
      required: true
