name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Oxyfin version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and desktop
      placeholder: NixOS 25.11, COSMIC (Wayland)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: AMD Barcelo, Mesa 25.2
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin server version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output, if any.
      render: text
