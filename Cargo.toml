[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"
repository = ""

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"

# Unoptimized text layout and drawing freeze the interface for up to a second.
[profile.dev.package."*"]
opt-level = 1

# Trickplay sheets are large JPEGs: an unoptimized decoder takes seconds on each.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3
